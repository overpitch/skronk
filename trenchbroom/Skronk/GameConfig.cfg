{
    "version": 9,
    "name": "Skronk",
    "fileformats": [
        { "format": "Quake2 (Valve)" }
    ],
    "filesystem": {
        "searchpath": "assets",
        "packageformat": { "extension": ".zip", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".png", ".jpg", ".jpeg"]
    },
    "entities": {
        "definitions": [ "skronk.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [],
        "brushface": [
            {
                "name": "Portal",
                "attribs": [],
                "match": "surfaceflag",
                "flags": [ "portal" ]
            },
            {
                "name": "Nodraw",
                "attribs": [ "transparent" ],
                "match": "surfaceflag",
                "flags": [ "nodraw" ]
            },
            {
                "name": "Clip",
                "attribs": [ "transparent" ],
                "match": "material",
                "pattern": "*clip"
            }
        ]
    },
    "faceattribs": {
        "surfaceflags": [
            {
                "name": "portal",
                "description": "Portals can be placed on this face"
            }, // 1 << 0
            {
                "name": "nodraw",
                "description": "Solid, but not drawn"
            } // 1 << 1
        ],
        "contentflags": []
    },
    "softMapBounds": "-8192 -8192 -8192 8192 8192 8192"
}
